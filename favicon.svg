<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- AI Teacher / Academic Cap Symbol -->
  <!-- Birrete superior -->
  <polygon points="32,13 54,23 32,33 10,23" fill="url(#aiGrad)" filter="url(#glow)"/>
  
  <!-- Base birrete -->
  <path d="M19,28 L19,38 C19,43.5 45,43.5 45,38 L45,28" fill="none" stroke="url(#aiGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Borla colgante derecha -->
  <path d="M48,25.5 L48,34" fill="none" stroke="url(#amberGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="35.5" r="2" fill="#f59e0b"/>

  <!-- Símbolo TCREI / AI Sparkle + FP Plus Central -->
  <path d="M32,39 L32,53 M25,46 L39,46" stroke="url(#amberGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Neural Sparks / Constellation Nodes -->
  <circle cx="32" cy="13" r="2.5" fill="#ffffff"/>
  <circle cx="54" cy="23" r="2" fill="#38bdf8"/>
  <circle cx="10" cy="23" r="2" fill="#38bdf8"/>
</svg>
